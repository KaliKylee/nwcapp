name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar o APK em Releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar o site para dentro do app
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW"
          cp -r index.html manifest.json favicon.png assets features "$WWW/"
          python3 - <<'PY'
          p = 'android/app/src/main/assets/www/features/catalog/logic.js'
          s = open(p, encoding='utf-8').read()
          old = """function buildShareUrl(g){
            return `${window.location.origin}${window.location.pathname}${gameShareHash(g)}`;
          }"""
          new = """function buildShareUrl(g){
            const base = window.location.hostname === 'appassets.androidplatform.net'
              ? 'https://newwaycommunity.vercel.app/'
              : `${window.location.origin}${window.location.pathname}`;
            return `${base}${gameShareHash(g)}`;
          }"""
          if old not in s:
              raise SystemExit('buildShareUrl não encontrado em logic.js: ajuste o patch do workflow')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY

      - name: Preparar a chave de assinatura (se configurada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Sem KEYSTORE_BASE64: gerando APK debug (a assinatura muda a cada build, então não atualiza por cima do app já instalado)."
          fi

      - name: Compilar o APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle -p android "$TASK" \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}
          mkdir -p dist
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/NewWayCommunity.apk \;
          ls -lh dist

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: NewWayCommunity-apk
          path: dist/NewWayCommunity.apk

      - name: Publicar em Releases (quando a tag começa com v)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NewWayCommunity.apk
